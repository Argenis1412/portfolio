# Render Configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: portfolio-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon

    # Health Check
    healthCheckPath: /health

    # Environment Variables
    envVars:
      - key: ENVIRONMENT
        value: production

      # Secrets (configure in Render dashboard)
      - key: RESEND_API_KEY
        sync: false

      - key: RESEND_FROM_EMAIL
        sync: false

      - key: RESEND_TO_EMAIL
        sync: false

      - key: REDIS_URL
        sync: false

      - key: METRICS_BASIC_AUTH_USERNAME
        sync: false

      - key: METRICS_BASIC_AUTH_PASSWORD
        sync: false

      - key: ALLOWED_ORIGINS
        sync: false # Configure in Render dashboard with frontend domain

    # Auto-deploy
    autoDeploy: true
    branch: main

    # Build settings
    buildCommand: echo "Building with Docker..."

    # Scaling
    numInstances: 1
